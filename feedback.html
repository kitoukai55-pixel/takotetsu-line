<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>たこ鉄｜新作たこ焼きの本音調査</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101010;color:#f7f3e9;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;line-height:1.5}.wrap{max-width:640px;margin:auto;padding:22px 14px 60px}h1{font-size:23px;color:#e8c777;text-align:center;margin:8px 0 14px}.intro{font-size:14px;color:#ddd;text-align:center;margin-bottom:20px}.panel{background:#242424;border:1px solid #66552d;border-radius:13px;padding:16px 12px;margin:14px 0}h2{font-size:17px;color:#e8c777;margin:0 0 12px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choice{border:1px solid #8a7851;background:#343434;color:white;border-radius:9px;min-height:48px;padding:9px 5px;font-size:14px;overflow-wrap:anywhere}.choice.selected{background:#d4ae54;color:#161616;border-color:#ffe29b;font-weight:700}.stars{display:flex;gap:7px;margin:7px 0 17px}.star{font-size:34px;background:transparent;border:0;color:#777;padding:0 2px;line-height:1.2}.star.on{color:#f2c456}.item{font-size:14px;margin-top:12px}textarea{width:100%;background:#171717;border:1px solid #8a7851;color:#fff;border-radius:8px;padding:12px;font-size:16px;min-height:105px}button{cursor:pointer}.primary{background:linear-gradient(#f1d88e,#bc8d36);color:#18130a;border:0;border-radius:10px;padding:15px 12px;font-size:17px;font-weight:800;width:100%;margin-top:12px}.secondary{background:#333;color:#f1d88e;border:1px solid #b99b58;border-radius:10px;padding:12px;width:100%;margin-top:12px;font-size:15px}.muted{font-size:13px;color:#c6c6c6}.result{white-space:pre-wrap;background:#222;border:1px solid #7c693f;border-radius:10px;padding:16px;font-size:15px;overflow-wrap:anywhere}#review{display:none}.notice{font-size:13px;color:#e4d3aa;margin-top:12px}</style></head><body><main class="wrap"><h1>遠慮なし！新作たこ焼きの本音調査</h1><p class="intro">先行販売モニターへのご協力ありがとうございます。率直なご感想をお聞かせください。回答は任意です。</p><section id="form"><div class="panel"><h2>① 第一印象は？</h2><div class="choices" data-q="first"></div></div><div class="panel"><h2>② 味の満足度は？</h2><div class="choices" data-q="taste"></div></div><div class="panel"><h2>③ 紅白たこ焼きの評価</h2><div class="item">えび紅しょうがタルタル（ピンク）</div><div class="stars" data-star="pink"></div><div class="item">ヒマラヤ岩塩マヨごま油（白）</div><div class="stars" data-star="white"></div><p class="muted">星をタップして評価。選択中の星をもう一度押すと解除できます。</p></div><div class="panel"><h2>④ 味の濃さは？</h2><div class="choices" data-q="strength"></div></div><div class="panel"><h2>⑤ 1,900円の価格は？</h2><div class="choices" data-q="price"></div></div><div class="panel"><h2>⑥ また食べたい？</h2><div class="choices" data-q="again"></div></div><div class="panel"><h2>⑦ その他のご意見（任意）</h2><textarea id="comment" placeholder="改善してほしい点など、ご自由にどうぞ"></textarea></div><p class="muted" id="count"></p><button class="primary" id="confirm">回答内容を確認する</button><button class="secondary" id="reset">リセット</button></section><section id="review"><h2>回答内容の確認</h2><div class="result" id="result"></div><button class="primary" id="copy">感想をコピー</button><button class="secondary" id="edit">回答を修正する</button><p class="notice" id="copynote">コピーした文章をLINEのトークに貼り付けて送信してください。自動送信はされません。</p></section></main><script>const options={first:['めっちゃ美味しそう','美味しそう','普通','見た目が惜しい'],taste:['大満足','満足','普通','イマイチ'],strength:['ちょうどいい','少し濃い','少し薄い','味に違和感'],price:['お得だと思う','妥当だと思う','少し高い','高い'],again:['絶対食べたい','機会があれば','どちらとも言えない','もういいかな']};const state={first:null,taste:null,pink:0,white:0,strength:null,price:null,again:null};function render(){document.querySelectorAll('[data-q]').forEach(el=>{let key=el.dataset.q;el.replaceChildren();options[key].forEach(v=>{let b=document.createElement('button');b.className='choice'+(state[key]===v?' selected':'');b.textContent=v;b.type='button';b.setAttribute('aria-pressed',state[key]===v);b.onclick=()=>{state[key]=state[key]===v?null:v;render()};el.append(b)})});document.querySelectorAll('[data-star]').forEach(el=>{let key=el.dataset.star;el.replaceChildren();for(let n=1;n<=5;n++){let b=document.createElement('button');b.type='button';b.className='star'+(n<=state[key]?' on':'');b.textContent='★';b.setAttribute('aria-label',n+'つ星');b.setAttribute('aria-pressed',state[key]===n);b.onclick=()=>{state[key]=state[key]===n?0:n;render()};el.append(b)}});let count=Object.entries(state).filter(([k,v])=>v!==null&&v!==0).length+(document.getElementById('comment').value.trim()?1:0);document.getElementById('count').textContent='回答済み：'+count+'／7項目'}document.getElementById('comment').oninput=render;function resultText(){let v=k=>state[k]??'未回答',s=k=>state[k]?state[k]+'／5':'未回答';return ['【たこ鉄・先行販売モニター 本音調査】','① 第一印象：'+v('first'),'② 味の満足度：'+v('taste'),'③ 紅白たこ焼きの評価','えび紅しょうがタルタル（ピンク）：'+s('pink'),'ヒマラヤ岩塩マヨごま油（白）：'+s('white'),'④ 味の濃さ：'+v('strength'),'⑤ 1,900円の価格：'+v('price'),'⑥ また食べたい？：'+v('again'),'⑦ その他のご意見：'+(document.getElementById('comment').value.trim()||'なし')].join('\n')}document.getElementById('confirm').onclick=()=>{document.getElementById('result').textContent=resultText();document.getElementById('form').style.display='none';document.getElementById('review').style.display='block';window.scrollTo(0,0)};document.getElementById('edit').onclick=()=>{document.getElementById('form').style.display='block';document.getElementById('review').style.display='none';window.scrollTo(0,0)};document.getElementById('reset').onclick=()=>{Object.keys(state).forEach(k=>state[k]=['pink','white'].includes(k)?0:null);document.getElementById('comment').value='';render()};document.getElementById('copy').onclick=async()=>{let t=resultText();try{await navigator.clipboard.writeText(t);document.getElementById('copynote').textContent='コピーできました。LINEのトークに貼り付けて送信してください。'}catch(e){let ta=document.createElement('textarea');ta.value=t;document.body.append(ta);ta.select();let ok=document.execCommand('copy');ta.remove();document.getElementById('copynote').textContent=ok?'コピーできました。LINEのトークに貼り付けて送信してください。':'コピーできない場合は、回答文を長押ししてコピーしてください。'}};render();</script></body></html>
