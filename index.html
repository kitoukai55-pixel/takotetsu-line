<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>たこ鉄｜昼お持ち帰り注文・確定版</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;font-size:15px}main{max-width:650px;margin:auto;padding:18px 13px 80px}h1{text-align:center;color:#e6c478;font-size:32px;margin:8px}h2{font-size:19px;color:#e6c478}h3{font-size:16px;color:#e6c478}p{line-height:1.55}.center{text-align:center}.small{font-size:12px}.gold{color:#e6c478}.red{color:#ff7777}.muted{color:#ccc}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.panel,.item{background:#282828;border:1px solid #927748;border-radius:12px;padding:13px;margin:9px 0}.item{cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:62px}.item span{flex:1}.item b{color:#e6c478;white-space:nowrap}button{font:inherit;border:1px solid #927748;background:#272727;color:#fff;border-radius:9px;padding:12px 10px;cursor:pointer;min-height:44px}button.active,button.primary{background:#e6c478;color:#171717;font-weight:bold;border-color:#e6c478}button.full{width:100%;margin:5px 0}button.danger{color:#ff7777;border-color:#ff7777}button:disabled{opacity:.35;cursor:default}.counter{display:flex;align-items:center;gap:12px}.counter button{min-width:42px;padding:8px}.counter b{min-width:18px;text-align:center}.line{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}.line>span:first-child{flex:1}.line small{display:block;color:#e6c478}.line strong{color:#e6c478}input,select{width:100%;background:#1c1c1c;color:white;border:1px solid #927748;border-radius:8px;padding:12px;font:inherit;font-size:16px;min-height:44px}label.choice{display:block;padding:9px 4px;line-height:1.5}label.choice input{width:auto;min-height:0;margin-right:8px;accent-color:#e6c478}hr{border:0;border-top:1px solid #927748;margin:15px 0}.total{background:#202020;border:1px solid #927748;border-radius:12px;padding:14px;margin-top:20px}.error{color:#ff7777;font-weight:bold}textarea{width:100%;min-height:180px}.hidden{display:none}#notice{white-space:pre-wrap}.spacer{height:8px}</style></head><body><main><h1>たこ鉄</h1><p class="center gold small">昼お持ち帰り注文・最終確定版</p><div id="nav" class="grid"><button onclick="chooseCat('tako')">たこ焼き</button><button onclick="chooseCat('bento')">弁当・ザンギ</button><button onclick="chooseCat('curry')">ブラックたこカレー</button><button onclick="chooseCat('limited')">先行販売</button></div><div id="app"></div><div id="totals" class="total"></div></main><script>

const MENUS={"tako": [["定番たこ焼き", 1400], ["和風素焼き", 1400], ["明太子マヨたこ焼き", 1500], ["ぶっかけネギ塩ダレ", 1500], ["ヒマラヤ岩塩ごま油", 1500], ["チーズダッカルビ風", 1600], ["カレーてりたま／てりたま", 1600], ["ヤンニョムキムチ", 1700], ["エビ紅生姜タルタル", 1800], ["つけたこ焼き", 1800]], "normal": [["ザンギ弁当", 850], ["タルタルザンギ弁当", 900], ["甘酢あんかけザンギ弁当", 900], ["ヤンニョムザンギ弁当", 900], ["ネギ塩ダレザンギ弁当", 950], ["コロッケザンギ弁当", 950], ["チキン南蛮ザンギ弁当", 950], ["照焼きザンギ弁当", 950], ["ハニーマスタードザンギ弁当", 1000], ["ガリバタザンギ弁当", 1000], ["エビフライザンギ弁当", 1050], ["ロースカツザンギ弁当", 1050], ["チーズタッカルビ風ザンギ弁当", 1050], ["エビ紅生姜タルタルザンギ弁当", 1100]], "big": [["1K唐揚げ弁当", 1200], ["ネギ塩ダレ唐揚げ弁当", 1400], ["タルタル唐揚げ弁当", 1400], ["甘酢あんかけ唐揚げ弁当", 1400], ["チキン南蛮唐揚げ弁当", 1400], ["ヤンニョムチキン弁当", 1400], ["エビフライ唐揚げ弁当", 1400], ["ロースカツ唐揚げ弁当", 1400], ["ガリバタザンギ弁当", 1400], ["ハニーマスタードザンギ弁当", 1400], ["照焼きザンギ弁当", 1400], ["チーズタッカルビ弁当", 1500], ["エビ紅生姜タルタルザンギ弁当", 1500], ["エビフライだけ弁当", 1600], ["ロースカツだけ弁当", 1700]], "zangi": [["デカザンギ", 550, 1050], ["タルタルザンギ", 600, 1150], ["ヤンニョムザンギ", 600, 1150], ["甘酢あんかけザンギ", 600, 1150], ["チキン南蛮ザンギ", 650, 1250], ["ネギ塩ダレザンギ", 650, 1250], ["チーズタッカルビザンギ", 650, 1250], ["エビ紅生姜タルタルザンギ", 750, 1450], ["ハニーマスタードザンギ", 700, 1350], ["ガリバタザンギ", 700, 1350], ["照焼きザンギ", 650, 1250]], "extras": [["ロースカツ1枚", 300], ["コロッケ2個", 200], ["カニクリームコロッケ3個", 300], ["エビフライ3本", 300], ["キムチ100g", 400], ["タルタル追加", 50], ["ネギ塩ダレ追加", 200]], "curry": [["ブラックたこカレー", 1250], ["ブラックたこザンギカレー", 1450], ["ブラックたこカレー＋たこ焼き15個セット", 2250]], "limited": [["紅白めでたたこ焼き", 1900]]},TOPS=[["ネギ", 200], ["チーズ盛り", 200], ["ゆかり", 200], ["わさび", 200], ["てりたま", 300], ["チーズイン", 400], ["ガリバタ", 400], ["キムチ", 400], ["からしマヨに変更", 200], ["タコ→ポテサラ変更", 0]],SAUCES=["ポン酢", "たこ鉄特製醤油ダレ", "酢豚のタレ（甘酢あん）", "デミグラスソース", "チリソース", "ベルのタレ", "オーロラソース", "ヒマラヤ岩塩", "からしマヨネーズ"],FLAVORS=[["甘口", 0], ["旨口", 0], ["辛口", 0], ["和風素焼き", 0], ["明太子マヨ", 100], ["ヒマラヤ岩塩ごま油", 100], ["ぶっかけネギ塩ダレ", 200], ["チーズダッカルビ風", 200], ["カレーてりたま", 200], ["てりたま", 200], ["ヤンニョムキムチ", 300], ["エビ紅生姜タルタル", 400]];
let category='tako',sub='normal',idx=-1,stage='shop',cart=[],err='',customer={name:'',phone:'',day:'today',time:''},form={};
const yen=n=>Number(n).toLocaleString('ja-JP')+'円', esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);const current=()=>MENUS[category==='bento'?sub:category];const item=()=>current()[idx];
function reset(){idx=-1;form={qty:1,fl:'',s1:'',s2:'',tops:{},rice:0,tartar:0,negi:0,z3:0,z6:0,cheese:0,zangi:0,noTako:false,setFlavor:-1,friend:true,monitor:false};err=''}reset();
function chooseCat(c){category=c;stage='shop';reset();render()}function chooseSub(s){sub=s;reset();render()}function choose(i){reset();idx=i;render()}function go(s){stage=s;err='';render();window.scrollTo(0,0)}
function set(k,v){form[k]=v;err='';render()}function num(k,d,max=999){form[k]=Math.max(k==='qty'?1:0,Math.min(max,(form[k]||0)+d));render()}function adjustTop(i,d){const max=category==='curry'&&[5,6,8].includes(i)?1:999;form.tops[i]=Math.max(0,Math.min(max,(form.tops[i]||0)+d));render()}
function counter(k,v,max=999){return `<div class="counter"><button onclick="num('${k}',-1,${max})">−</button><b>${v}</b><button ${v>=max?'disabled':''} onclick="num('${k}',1,${max})">＋</button></div>`}
function radio(k,options,required=false){return options.map(([name,val,price])=>`<label class="choice"><input type="radio" name="${k}" ${String(form[k])===String(val)?'checked':''} onchange="set('${k}',${JSON.stringify(val).replace(/"/g,'&quot;')})"><span class="${required&&String(form[k])!==String(val)?'red':''}">${esc(name)}${price?` ＋${yen(price)}`:''}</span></label>`).join('')}
function selectSauce(k){return `<select onchange="set('${k}',this.value)"><option value="">選択してください</option>${SAUCES.map(s=>`<option ${form[k]===s?'selected':''} value="${esc(s)}">${esc(s)}</option>`).join('')}</select>`}
function compute(){if(idx<0)return {gross:0,discount:0,unit:0};const p=item(),f=form,solo=category==='bento'&&sub==='zangi';let unit=p[1];if(category==='tako'||category==='curry'&&idx===2)unit+=Object.entries(f.tops).reduce((n,[k,v])=>n+TOPS[+k][1]*v,0);if(category==='curry'||category==='bento'&&sub==='normal')unit+=[0,150,250][f.rice];if(category==='bento'&&['normal','big'].includes(sub))unit+=f.tartar*50+f.negi*200;if(category==='curry')unit+=f.cheese*200+f.zangi*200+(idx===2&&f.setFlavor>=0?FLAVORS[f.setFlavor][1]:0);let gross=solo?f.z3*p[1]+f.z6*p[2]:unit*f.qty;let discount=category==='tako'?400*f.qty:category==='limited'&&f.friend?400*f.qty:category==='curry'&&idx===1?200*f.qty:0;return {gross,discount,unit}}
function add(){if(category==='tako'&&[0,6].includes(idx)&&!form.fl){err='味を選んでな';render();return}if(category==='tako'&&idx===9&&(!form.s1||!form.s2)){err='つけ汁を2個選んでな';render();return}if(category==='curry'&&idx===2&&form.setFlavor<0){err='セットのたこ焼きを選んでな';render();return}if(category==='bento'&&sub==='zangi'&&form.z3+form.z6===0){err='3個入りか6個入りを選んでな';render();return}const f=form,p=item(),solo=category==='bento'&&sub==='zangi',bento=category==='bento'&&['normal','big'].includes(sub),details=[];if(f.fl)details.push('味：'+f.fl);if(f.s1)details.push('1個目のつけ汁：'+f.s1,'2個目のつけ汁：'+f.s2);if(category==='tako'||category==='curry'&&idx===2)Object.entries(f.tops).forEach(([k,v])=>{if(v>0)details.push('たこ焼きトッピング：'+TOPS[+k][0]+' × '+v)});if(bento){if(sub==='normal')details.push('ライス：'+['200g','300g','400g'][f.rice]);if(f.tartar)details.push('タルタル追加：'+f.tartar+'個');if(f.negi)details.push('ネギ塩ダレ追加：'+f.negi+'個')}if(category==='curry'){if(idx===2)details.unshift('セットたこ焼き：'+FLAVORS[f.setFlavor][0]);details.push('ライス：'+['250g','350g','450g'][f.rice]);if(f.cheese)details.push('チーズ追加：'+f.cheese+'個');if(f.zangi)details.push('ザンギ追加：'+f.zangi+'個');if(f.noTako)details.push('タコ無し')}if(category==='limited'){details.push('白10個：ヒマラヤ岩塩マヨごま油','ピンク5個：えび紅しょうがタルタル');if(f.monitor)details.push('モニター感想協力：可')}if(solo){if(f.z3)details.push('3個入り × '+f.z3);if(f.z6)details.push('6個入り × '+f.z6)}const c=compute();cart.push({name:p[0]+(category==='bento'&&sub==='big'&&idx!==0?'【1kg弁当】':''),qty:solo?f.z3+f.z6:f.qty,gross:c.gross,discount:c.discount,details,bento,bonus:bento?f.qty:0,setDiscount:category==='curry'&&idx===2});reset();go('cart')}
function amounts(){return {gross:cart.reduce((n,c)=>n+c.gross,0),discount:cart.reduce((n,c)=>n+c.discount,0)}}
function dayDate(key){const now=new Date(),offset={previous:-1,today:0,next:1}[key];return new Date(now.getFullYear(),now.getMonth(),now.getDate()+offset)}
function dateLabel(key){const d=dayDate(key);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`}
function dateOptions(){return [['previous','前日予約'],['today','当日'],['next','翌日']].map(([k,v])=>`<label class="choice"><input type="radio" name="day" ${customer.day===k?'checked':''} onchange="customer.day='${k}';render()">${v}　${dateLabel(k)}</label>`).join('')}
function phoneFmt(v){let d=v.replace(/\D/g,'').slice(0,11);return d.length>7?d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7):d.length>3?d.slice(0,3)+'-'+d.slice(3):d}
function phoneChange(el){customer.phone=phoneFmt(el.value);el.value=customer.phone}
function timeChange(el){const d=el.value.replace(/\D/g,'').slice(0,4);customer.time=d.length>2?d.slice(0,2)+':'+d.slice(2):d;el.value=customer.time}
function validate(){if(!customer.name.trim())err='お名前を入力してな';else if(!/^0\d{10}$/.test(customer.phone.replace(/\D/g,'')))err='携帯電話番号は11桁で入力してな';else if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(customer.time)||customer.time<'11:00'||customer.time>'15:00')err='11:00〜15:00の時間を入力してな';else if(dayDate(customer.day).getDay()===4)err='木曜は昼定休日やで';else if(dayDate(customer.day)<new Date(new Date().setHours(0,0,0,0)))err='過去の日付では注文できへんで';else{go('confirm');return}render()}
function orderText(){const a=amounts();return ['【たこ鉄・昼お持ち帰り注文】','',cart.map((c,i)=>[`${i+1}. ${c.name} × ${c.qty}`,...c.details,`商品小計：${yen(c.gross)}`,...(c.bento?['LINE友達ザンギ1個増量：無料']:c.setDiscount?['セットメニュー400円引き（価格に反映済み）']:c.discount?[`LINE友だち割引：−${yen(c.discount)}`]:[]),`お支払い金額：${yen(c.gross-c.discount)}`].join('\n')).join('\n\n'),'','──────────',`商品合計：${yen(a.gross)}`,`LINE友だち割引合計：−${yen(a.discount)}`,`お支払い合計：${yen(a.gross-a.discount)}`,'','【お客様情報・受け取り情報】',`お名前：${customer.name}`,`携帯電話番号：${customer.phone}`,`受取希望：${{previous:'前日予約',today:'当日',next:'翌日'}[customer.day]} ${dateLabel(customer.day)} ${customer.time}`,'調理所要時間：約20分','※店舗からの返信をもって注文確定'].join('\n')}
async function copyOrder(){const t=orderText();try{await navigator.clipboard.writeText(t);$('notice').textContent='コピーできたで。LINEに貼り付けてな。'}catch(e){const a=$('fallback');a.classList.remove('hidden');a.value=t;a.focus();a.select();try{document.execCommand('copy');$('notice').textContent='コピーを試みたで。LINEに貼り付けて確認してな。'}catch(e2){$('notice').textContent='下の文章を全選択してコピーしてな。'}}}
function button(label,action,cls=''){return `<button class="full ${cls}" onclick="${action}">${label}</button>`}
function cartCard(c,i,remove){return `<div class="panel"><b>${i+1}. ${esc(c.name)} × ${c.qty}</b>${c.details.map(x=>`<p class="small">${esc(x)}</p>`).join('')}<div class="line"><span>商品小計</span><b>${yen(c.gross)}</b></div>${c.bento?`<div class="line red"><span>LINE友達ザンギ1個増量</span><b>無料</b></div>${c.bonus>1?`<p class="red small">弁当${c.bonus}個分・ザンギ${c.bonus}個増量</p>`:''}`:c.setDiscount?'<p class="red">セットメニュー400円引き（適用済み）</p>':c.discount?`<div class="line red"><span>LINE友だち割引</span><b>−${yen(c.discount)}</b></div>`:''}<div class="line gold"><span>お支払い金額</span><b>${yen(c.gross-c.discount)}</b></div>${remove?`<button class="danger" onclick="cart.splice(${i},1);render()">削除</button>`:''}</div>`}
function render(){const nav=$('nav');nav.innerHTML=[['tako','たこ焼き'],['bento','弁当・ザンギ'],['curry','ブラックたこカレー'],['limited','先行販売']].map(([k,v])=>`<button class="${category===k?'active':''}" onclick="chooseCat('${k}')">${v}</button>`).join('');let h='';if(stage==='shop'){if(category==='bento')h+='<div class="grid">'+[['normal','通常弁当'],['big','1kg弁当'],['zangi','ザンギ単品'],['extras','その他・追加']].map(([k,v])=>`<button class="${sub===k?'active':''}" onclick="chooseSub('${k}')">${v}</button>`).join('')+'</div>';if(idx<0){h+='<h2>商品を選択</h2>'+current().map((p,i)=>`<div class="item" onclick="choose(${i})"><span>${esc(p[0])}${category==='curry'&&i===1?'<small class="red">LINE友だち割引200円引き</small>':''}${category==='curry'&&i===2?'<small class="red">セットメニュー400円引き（割引後価格）</small>':''}${category==='limited'?'<small class="red">LINE友だち割引400円</small>':''}</span><b>${yen(p[1])}</b></div>`).join('')}else{const p=item(),f=form,c=compute();h+=button('商品一覧へ戻る','reset();render()')+`<div class="panel"><h2>${esc(p[0])}</h2><h2>${yen(p[1])}</h2>`;if(category==='tako'&&[0,6].includes(idx))h+='<h3>味を選択（必須）</h3>'+radio('fl',(idx===0?['甘口','旨口','辛口']:['カレーてりたま','てりたま']).map(x=>[x,x,0]),true);if(category==='tako'&&idx===9)h+='<h3>1個目のつけ汁（必須）</h3>'+selectSauce('s1')+'<h3>2個目のつけ汁（必須）</h3>'+selectSauce('s2');if(category==='curry'&&idx===2)h+='<p class="red">セットメニュー400円引き（2250円に反映済み・追加割引なし）</p><h3>セットのたこ焼きを選択（必須）</h3>'+radio('setFlavor',FLAVORS.map((x,i)=>[x[0],i,x[1]]),true);if(category==='tako'||category==='curry'&&idx===2){h+='<h3>たこ焼きトッピング</h3>';const arr=category==='tako'?TOPS:TOPS.slice(0,9);h+=arr.map((t,i)=>`<div class="line"><span>${esc(t[0])}<small>＋${yen(t[1])}／個</small></span><div class="counter"><button onclick="adjustTop(${i},-1)">−</button><b>${f.tops[i]||0}</b><button ${category==='curry'&&[5,6,8].includes(i)&&(f.tops[i]||0)>=1?'disabled':''} onclick="adjustTop(${i},1)">＋</button></div></div>`).join('')}if(category==='bento'&&['normal','big'].includes(sub)){if(sub==='normal')h+='<h3>ライス量</h3>'+radio('rice',[['200g（無料）',0],['300g（＋150円）',1],['400g（＋250円）',2]]);h+='<div class="line"><span>タルタル追加<small>＋50円／個</small></span>'+counter('tartar',f.tartar)+'</div><div class="line"><span>ネギ塩ダレ追加<small>＋200円／個</small></span>'+counter('negi',f.negi)+'</div>'}if(category==='bento'&&sub==='zangi')h+=`<div class="line"><span>3個入り<small>${yen(p[1])}</small></span>${counter('z3',f.z3)}</div><div class="line"><span>6個入り<small>${yen(p[2])}</small></span>${counter('z6',f.z6)}</div>`;if(category==='curry'){h+='<h3>カレートッピング</h3>'+radio('rice',[['普通250g（無料）',0],['大盛り350g（＋150円）',1],['特盛り450g（＋250円）',2]])+`<div class="line"><span>チーズ追加<small>＋200円</small></span>${counter('cheese',f.cheese,3)}</div><div class="line"><span>ザンギ追加<small>＋200円</small></span>${counter('zangi',f.zangi,idx===1?2:3)}</div>`;if(idx!==2)h+=`<label class="choice"><input type="checkbox" ${f.noTako?'checked':''} onchange="set('noTako',this.checked)">タコ無し（無料）</label>`;if(idx===1)h+='<p class="red">LINE友だち割引200円引き</p>'}if(category==='limited')h+=`<p>両サイド（白）10個：ヒマラヤ岩塩マヨごま油</p><p>中央（ピンク）5個：えび紅しょうがタルタル</p><p class="red">LINE友だち割引400円</p><label class="choice"><input type="checkbox" ${f.friend?'checked':''} onchange="set('friend',this.checked)">LINE友だち割引を適用する</label><label class="choice"><input type="checkbox" ${f.monitor?'checked':''} onchange="set('monitor',this.checked)">先行販売モニター・感想協力（任意）</label>`;if(!(category==='bento'&&sub==='zangi'))h+=`<div class="line"><span>注文数量</span>${counter('qty',f.qty)}</div>`;h+=`<hr><div class="line"><span>商品小計</span><b>${yen(c.gross)}</b></div>`;if(category==='bento'&&['normal','big'].includes(sub))h+='<p class="red">LINE友達ザンギ1個増量：無料</p>';else if(category==='curry'&&idx===2)h+='<p class="red">セットメニュー400円引き：適用済み</p>';else if(c.discount)h+=`<p class="red">LINE友だち割引：−${yen(c.discount)}</p>`;h+=`<div class="line gold"><span>お支払い金額</span><b>${yen(c.gross-c.discount)}</b></div><p class="error">${esc(err)}</p>${button('カートに追加','add()','primary')}</div>`}h+=button(`共通カートを見る（${cart.length}件）`,'go("cart")')}else if(['cart','review','confirm'].includes(stage)){h+=`<h2>${stage==='cart'?'共通カート':stage==='review'?'商品確認':'最終注文確認'}</h2>`;if(!cart.length)h+='<p>まだ商品が入ってへんで。</p>';h+=cart.map((c,i)=>cartCard(c,i,stage==='cart')).join('');if(stage==='cart')h+=button('ほかの商品を追加','reset();go("shop")','primary')+(cart.length?button('選んだ商品の確認へ','go("review")'):'');else if(stage==='review')h+=button('お客様情報・受け取り情報入力','go("customer")','primary')+button('カートに戻る','go("cart")');else h+=`<div class="panel"><p>お名前：${esc(customer.name)}</p><p>携帯電話番号：${esc(customer.phone)}</p><p>受取希望：${{previous:'前日予約',today:'当日',next:'翌日'}[customer.day]} ${dateLabel(customer.day)} ${esc(customer.time)}</p></div>${button('注文内容をコピー','copyOrder()','primary')}<p id="notice" class="gold"></p><textarea id="fallback" class="hidden"></textarea>${button('入力画面に戻る','go("customer")')}`}else if(stage==='customer'){h+=`<h2>お客様情報・受け取り情報入力</h2><p>お名前</p><input value="${esc(customer.name)}" placeholder="例：鈴木" oninput="customer.name=this.value"><p>携帯電話番号</p><input type="tel" inputmode="numeric" value="${esc(customer.phone)}" placeholder="090-1234-5678" oninput="phoneChange(this)"><h3>受取希望日</h3>${dateOptions()}<p>受取希望時間（11:00〜15:00）</p><input type="tel" inputmode="numeric" value="${esc(customer.time)}" placeholder="14:30" oninput="timeChange(this)"><p class="small">調理所要時間：約20分／木曜は昼定休日</p><p class="error">${esc(err)}</p>${button('最終注文確認へ','validate()','primary')}${button('商品確認へ戻る','go("review")')}`}const a=amounts();$('app').innerHTML=h;$('totals').innerHTML=`<div class="line"><span>商品合計</span><b>${yen(a.gross)}</b></div><div class="line red"><span>LINE友だち割引合計</span><b>−${yen(a.discount)}</b></div><hr><div class="line gold"><strong>お支払い合計</strong><strong style="font-size:24px">${yen(a.gross-a.discount)}</strong></div><p class="small">カート：${cart.length}件</p>`}
render();

</script></body></html>
