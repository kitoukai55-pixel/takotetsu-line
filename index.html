<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>たこ鉄｜昼のお持ち帰り注文</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101010;color:#e9d3a1;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}main{max-width:650px;margin:auto;padding:35px 16px 75px}h1{text-align:center;font-size:34px;color:#d9b869;margin:8px 0 28px}h2{font-size:23px;color:#dfc17c}h3{font-size:19px;margin:12px 0}p{line-height:1.7}.sub{text-align:center;color:#cfc3a7;font-weight:bold}.panel{background:#222;border:1px solid #a98942;border-radius:16px;padding:19px;margin:19px 0}.item{border:1px solid #65552f;border-radius:12px;padding:13px;margin:11px 0;background:#191919}button{font:inherit;cursor:pointer;border-radius:9px;padding:13px 14px;border:1px solid #8d7441;background:#262626;color:#f1d995;font-weight:700}button.primary{background:linear-gradient(110deg,#947332,#ddc077,#947332);color:#16120b;border:0;width:100%;padding:17px}button.secondary{width:100%;margin-top:9px}.row{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}.row button{min-width:45px}.muted{color:#c7bda8;font-size:14px}.price{font-size:19px;color:#f1d995;font-weight:bold}.choice{display:flex;align-items:center;gap:10px;text-align:left;width:100%;margin:7px 0;min-height:49px;background:#292929;color:#eee3c9}.circle{width:24px;height:24px;border:2px solid #9e9e9e;border-radius:50%;display:inline-grid;place-items:center;flex-shrink:0;font-size:16px}.recommended .circle{border-color:#e1bd67}.selected .circle{background:#d9b869;color:#111;border-color:#d9b869}.tag{font-size:12px;color:#eac56f;margin-left:auto}.selected{border-color:#d9b869;background:#40351f}.qty{display:flex;gap:12px;align-items:center}.qty b{min-width:28px;text-align:center}input{width:100%;background:#151515;color:#fff;border:1px solid #9e8551;border-radius:8px;font-size:18px;padding:14px;margin:5px 0 14px}input::placeholder{color:#8e8a81}.error{color:#ff9e9e;white-space:pre-line}.calendar{border:1px solid #796336;border-radius:12px;padding:10px}.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.days button{padding:9px 0;min-width:0;font-size:14px}.days button:disabled{opacity:.2;cursor:not-allowed}.days .active{background:#d9b869;color:#111}.days .weekday{font-size:12px;padding:6px 0;color:#bda773}.totals{border-top:1px solid #74603d;margin-top:15px;padding-top:10px}.total{font-size:22px;color:#e9c775;font-weight:bold}.line{border-bottom:1px solid #51462f;padding:12px 0}.spacer{height:12px}small{color:#c6bba4}#notice{position:sticky;top:0;background:#422e21;color:#fff;padding:10px;display:none;z-index:3}.timegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.timegrid button{padding:10px 2px;font-size:14px}.timegrid button.active{background:#d9b869;color:#111}@media(max-width:360px){main{padding:20px 10px}.timegrid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div id="notice"></div><main><h1>たこ鉄</h1><div class="sub">昼のお持ち帰り注文<br>11:00〜15:00・木曜定休</div><div id="app"></div></main><script>
const products=[['定番たこ焼き',1400],['和風素焼き',1400],['明太子マヨたこ焼き',1500],['ぶっかけネギ塩ダレ',1500],['ヒマラヤ岩塩ごま油',1500],['チーズダッカルビ風',1600],['カレーてりたま／てりたま',1600],['ヤンニョムキムチ',1700],['エビ紅生姜タルタル',1800],['つけたこ焼き',1800]];
const toppings=[['ネギ',200],['チーズ盛り',200],['ゆかり',200],['わさび',200],['てりたま',300],['チーズイン',400],['ガリバタ',400],['キムチ',400],['からしマヨに変更',200],['タコ→ポテサラ変更',0]];
const sauces=['ポン酢','たこ鉄特製醤油ダレ','酢豚のタレ（甘酢あん）','デミグラスソース','チリソース','ベルのタレ','オーロラソース','ヒマラヤ岩塩','からしマヨネーズ'];
// おすすめ対象は暫定表示。選択操作がない限り課金・追加しない。
const recommended={0:[0,1],1:[0,2],2:[1,5],3:[0,8],4:[2,3],5:[1,5],6:[1,4],7:[1,7],8:[0,8],9:[1,8]};
let stage='home',cart=[],product=-1,qty=1,flavor='',top=[],dip=[],name='',phone='',selectedDate='',time='',month=new Date(new Date().getFullYear(),new Date().getMonth(),1),error='';
const app=document.getElementById('app'),yen=n=>n.toLocaleString('ja-JP')+'円';
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,action,cls='')=>`<button class="${cls}" onclick="${action}">${label}</button>`;
const formatDate=d=>`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
const dateObj=s=>{let a=s.split('/').map(Number);return new Date(a[0],a[1]-1,a[2])};
function today(){let d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function navigate(s){stage=s;error='';render();window.scrollTo(0,0)}
function choose(i){product=i;qty=1;flavor='';top=[];dip=[];navigate('detail')}
function unit(){return products[product][1]+top.reduce((s,i)=>s+toppings[i][1],0)}
function sum(){return cart.reduce((s,c)=>s+c.unit*c.qty,0)}
function discount(){return cart.reduce((s,c)=>s+c.qty*400,0)}
function totals(){return `<div class="totals"><div class="row"><span>商品合計</span><b>${yen(sum())}</b></div><div class="row"><span>LINE友だち割引</span><b>−${yen(discount())}</b></div><div class="row total"><span>お支払い合計</span><span>${yen(sum()-discount())}</span></div></div>`}
function detailText(c){return `${c.flavor?'味：'+safe(c.flavor)+'<br>':''}トッピング：${c.top.length?c.top.map(i=>safe(toppings[i][0])).join('・'):'なし'}${c.dip.length?'<br>つけ汁：'+c.dip.map(i=>safe(sauces[i])).join('・'):''}`}
function toggleTop(i){top=top.includes(i)?top.filter(v=>v!==i):[...top,i];render()}
function toggleDip(i){if(dip.includes(i)){dip.splice(dip.indexOf(i),1)}else if(dip.length<2){dip.push(i)}else{error='つけ汁は2つまで選択できます。同じつけ汁を2つ選ぶ場合は「同じつけ汁を2つ」にチェックしてください。'}render()}
function sameDip(i){dip=[i,i];error='';render()}
function addCart(){if(product===0&&!flavor){error='味を選んでください';render();return}if(product===6&&!flavor){error='カレーてりたま／てりたまのどちらかを選んでください';render();return}if(product===9&&dip.length!==2){error='つけ汁を2つ選んでください（必須）';render();return}cart.push({product,qty,flavor,top:[...top],dip:[...dip],unit:unit()});navigate('cart')}
function removeCart(i){cart.splice(i,1);render()}
function quantity(d){qty=Math.max(1,qty+d);render()}
function changeMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}
function pickDate(s){selectedDate=s;error='';render()}
function calendar(){let first=new Date(month.getFullYear(),month.getMonth(),1),offset=first.getDay(),last=new Date(month.getFullYear(),month.getMonth()+1,0).getDate(),h='<div class="calendar"><div class="row">'+btn('‹','changeMonth(-1)')+`<b>${month.getFullYear()}年${month.getMonth()+1}月</b>`+btn('›','changeMonth(1)')+'</div><div class="days">';['日','月','火','水','木','金','土'].forEach(d=>h+=`<div class="weekday">${d}</div>`);for(let i=0;i<offset;i++)h+='<span></span>';for(let i=1;i<=last;i++){let d=new Date(month.getFullYear(),month.getMonth(),i),s=formatDate(d),disabled=d<today()||d.getDay()===4;h+=`<button type="button" class="${selectedDate===s?'active':''}" ${disabled?'disabled':''} onclick="pickDate('${s}')">${i}</button>`}return h+'</div></div><p class="muted">木曜と過去の日付は選べません。</p>'}
function setTime(t){time=t;render()}
function timeButtons(){let h='<div class="timegrid">';for(let hr=11;hr<=15;hr++)for(let min=0;min<60;min+=10){if(hr===15&&min>0)break;let t=String(hr).padStart(2,'0')+':'+String(min).padStart(2,'0');h+=`<button class="${time===t?'active':''}" onclick="setTime('${t}')">${t}</button>`}return h+'</div>'}
function saveInput(id,v){if(id==='name')name=v;if(id==='phone')phone=v.replace(/\D/g,'').slice(0,11);if(id==='time')time=v; }
function phoneDisplay(){let p=phone.replace(/\D/g,'');return p.length===11?`${p.slice(0,3)}-${p.slice(3,7)}-${p.slice(7)}`:p}
function validate(){error='';if(!cart.length)error='商品がありません';else if(!name.trim())error='お名前を入力してください';else if(!/^0\d{10}$/.test(phone))error='携帯番号を11桁で入力してください';else if(!selectedDate)error='受取希望日を選択してください';else if(dateObj(selectedDate)<today()||dateObj(selectedDate).getDay()===4)error='受取希望日を選び直してください';else if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(time))error='希望時間を4桁（例：1425）で入力してください';else if(time<'11:00'||time>'15:00')error='受取希望時間は11:00〜15:00で指定してください';else{let now=new Date(),d=dateObj(selectedDate),target=new Date(d.getFullYear(),d.getMonth(),d.getDate(),+time.slice(0,2),+time.slice(3));if(target.getTime()-now.getTime()<20*60000)error='調理に約20分かかります。20分以上先の受取時間を選んでください'}if(error){render();document.getElementById('err')?.scrollIntoView({block:'center'});return}navigate('confirm')}
function textOrder(){let lines=['【たこ鉄・昼お持ち帰り注文】'];cart.forEach((c,i)=>{lines.push(`${i+1}. ${products[c.product][0]} × ${c.qty}枚`);if(c.flavor)lines.push(`味：${c.flavor}`);lines.push(`トッピング：${c.top.length?c.top.map(j=>toppings[j][0]).join('・'):'なし'}`);if(c.dip.length)lines.push(`つけ汁：${c.dip.map(j=>sauces[j]).join('・')}`);lines.push(`小計：${yen(c.unit*c.qty)}`,'')});lines.push(`商品合計：${yen(sum())}`,`LINE友だち割引：−${yen(discount())}`,`合計：${yen(sum()-discount())}`,`お名前：${name}`,`携帯番号：${phoneDisplay()}`,`受取希望日時：${selectedDate} ${time}`,`調理所要時間：約20分`,`※店舗からの返信をもって注文確定`,`※この画面から自動送信はされません`);return lines.join('\n')}
async function copyOrder(){let t=textOrder();try{await navigator.clipboard.writeText(t);alert('注文内容をコピーしました。LINE公式のトークに貼り付けて送信してください。')}catch(e){let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();let ok=document.execCommand('copy');a.remove();if(ok)alert('コピーしました。LINEに貼り付けてください。');else{let x=document.getElementById('copyFallback');x.style.display='block';x.value=t;x.select();alert('自動コピーできませんでした。表示された注文内容を長押しでコピーしてください。')}}}
function render(){let h='';if(stage==='home'){h=`<section class="panel"><h2 style="text-align:center">お持ち帰り注文</h2><p style="color:#eee">LINE友だちは、たこ焼き1枚につき400円引き。何度でも利用OK！</p>${btn('お持ち帰り注文する',"navigate('list')",'primary')}</section><p class="muted" style="text-align:center">※店舗からの返信をもって注文確定となります。<br>このページから自動送信はされません。</p>`}
if(stage==='list'){h='<h2>商品を選択</h2><p>すべて15個入り・価格の安い順</p>';products.forEach((p,i)=>{h+=`<div class="item"><div class="row"><div><b>${safe(p[0])}</b><div class="price">${yen(p[1])}</div></div>${btn('選ぶ',`choose(${i})`)}</div></div>`});h+=btn(`カートを見る（${cart.length}件）`,"navigate('cart')",'secondary')}
if(stage==='detail'){let p=products[product];h=btn('‹ 商品一覧へ',"navigate('list')") + `<div class="panel"><h2>${safe(p[0])}</h2><p class="price">${yen(p[1])}／15個入り</p>`;if(product===0||product===6){h+='<h3>味を選択（必須）</h3>';let opts=product===0?['甘口','旨口','辛口']:['カレーてりたま','てりたま'];opts.forEach(v=>h+=`<button class="choice ${flavor===v?'selected':''}" onclick="flavor='${v}';render()"><span class="circle">${flavor===v?'✓':''}</span>${v}</button>`)}h+='<h3>トッピング（複数選択OK）</h3><p class="muted">おすすめは金色の丸。押したものだけ追加されます。</p>';toppings.forEach((t,i)=>{let on=top.includes(i),rec=(recommended[product]||[]).includes(i);h+=`<button class="choice ${on?'selected':''} ${rec?'recommended':''}" onclick="toggleTop(${i})"><span class="circle">${on?'✓':''}</span><span>${safe(t[0])}　${t[1]?'+'+yen(t[1]):'無料'}</span>${rec?'<span class="tag">おすすめ</span>':''}</button>`});if(product===9){h+='<h3>つけ汁を2つ選んでください（必須）</h3><p class="muted">同じつけ汁を2つ選ぶこともできます。</p>';sauces.forEach((s,i)=>{let count=dip.filter(x=>x===i).length;h+=`<div class="row"><button class="choice ${count?'selected':''}" style="flex:1" onclick="toggleDip(${i})"><span class="circle">${count?'✓':''}</span>${safe(s)}${count===2?' ×2':''}</button>${btn('同じの2つ',`sameDip(${i})`)}</div>`})}h+=`<h3>枚数</h3><div class="row"><div class="qty">${btn('−','quantity(-1)')}<b>${qty}</b>${btn('＋','quantity(1)')}</div><span class="price">${yen(unit()*qty)}</span></div><p id="err" class="error">${safe(error)}</p>${btn('カートに追加','addCart()','primary')}</div>`}
if(stage==='cart'){h='<h2>カート</h2>';if(!cart.length)h+='<p>商品はまだ入っていません。</p>';cart.forEach((c,i)=>{h+=`<div class="item"><div class="row"><b>${safe(products[c.product][0])} × ${c.qty}枚</b>${btn('削除',`removeCart(${i})`)}</div><p class="muted">${detailText(c)}</p><div class="price">小計：${yen(c.unit*c.qty)}</div></div>`});if(cart.length)h+=totals()+btn('受取情報へ',"navigate('info')",'primary');h+=btn('別の商品を追加',"navigate('list')",'secondary')}
if(stage==='info'){h=`<h2>受取情報</h2><div class="panel"><label>お名前<input id="name" value="${safe(name)}" oninput="saveInput('name',this.value)" placeholder="お名前" autocomplete="name"></label><label>携帯番号（11桁）<input id="phone" inputmode="numeric" value="${safe(phone)}" oninput="saveInput('phone',this.value)" placeholder="09012345678" autocomplete="tel"></label><h3>受取希望日</h3>${calendar()}<p>選択日：<b>${selectedDate||'未選択'}</b></p><h3>受取希望時間</h3><p class="muted">11:00〜15:00・調理約20分</p>${timeButtons()}<label>または4桁入力（例：1425）<input id="time" inputmode="numeric" maxlength="5" value="${safe(time)}" oninput="let v=this.value.replace(/\\D/g,'').slice(0,4);saveInput('time',v.length===4?v.slice(0,2)+':'+v.slice(2):v)" placeholder="1425"></label><p id="err" class="error">${safe(error)}</p>${btn('注文確認へ','validate()','primary')}${btn('カートへ戻る',"navigate('cart')",'secondary')}</div>`}
if(stage==='confirm'){h='<h2>注文内容の確認</h2><div class="panel">';cart.forEach((c,i)=>{h+=`<div class="line"><b>${i+1}. ${safe(products[c.product][0])} × ${c.qty}枚</b><p class="muted">${detailText(c)}</p><b>小計：${yen(c.unit*c.qty)}</b></div>`});h+=totals()+`<div class="line"><p>お名前：${safe(name)}</p><p>携帯番号：${phoneDisplay()}</p><p>受取希望日時：${selectedDate} ${time}</p><p>調理所要時間：約20分</p></div><p>店舗からの返信をもって注文確定です。自動送信はされません。</p>${btn('注文内容をコピー','copyOrder()','primary')}<textarea id="copyFallback" style="display:none;width:100%;height:200px"></textarea>${btn('受取情報を修正',"navigate('info')",'secondary')}${btn('カートを修正',"navigate('cart')",'secondary')}</div>`}
app.innerHTML=h}
render();
</script></body></html>
