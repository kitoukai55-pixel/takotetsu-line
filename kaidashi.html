7"><label><input class="pick" type="checkbox"/> <span>インスタントコーヒー🍛</span></label><div class="controls"><button class="minus">−</button><input class="qty" max="9999" min="1" type="number" value="1"/><button class="plus">＋</button><button class="bought">購入済</button></div></div></section><section class="category" data-group="木枠"><h2>木枠</h2><div class="product" data-id="6-0"><label><input class="pick" type="checkbox"/> <span>木枠（105＋30）</span></label><div class="controls"><button class="minus">−</button><input class="qty" max="9999" min="1" type="number" value="135"/><button class="plus">＋</button><button class="bought">購入済</button></div></div></section></div><script>(()=>{'use strict';
const KEY='takotetsu-list-v4', EXTRA='takotetsu-list-custom-v1';
const catalog=document.getElementById('catalog'),chosen=document.getElementById('chosen');
const nameInput=document.getElementById('productName'),groupInput=document.getElementById('productGroup'),saveBtn=document.getElementById('saveProduct'),cancelBtn=document.getElementById('cancelEdit');
const groups=[...catalog.querySelectorAll('.category')];
let state={},custom=[],editing=null;
try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
try{custom=JSON.parse(localStorage.getItem(EXTRA)||'[]')||[];if(!Array.isArray(custom))custom=[]}catch(e){}
for(const sec of groups){const op=document.createElement('option');op.value=sec.dataset.group;op.textContent=sec.dataset.group;groupInput.append(op)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(EXTRA,JSON.stringify(custom))}catch(e){}}
function makeProduct(item){const el=document.createElement('div');el.className='product';el.dataset.id=item.id;el.dataset.group=item.group;el.dataset.defaultQty='1';el.innerHTML='<label><input type="checkbox" class="pick"><span></span></label><div class="controls"><button class="minus" type="button">−</button><input class="qty" type="number" min="1" max="9999" value="1"><button class="plus" type="button">＋</button><button class="bought" type="button">購入済</button></div>';el.querySelector('label span').textContent=item.name;return el}
for(const item of custom){if(item&&item.id&&item.id.startsWith('custom-')&&!item.deleted&&item.name&&groups.some(g=>g.dataset.group===item.group))catalog.querySelector('.category[data-group="'+item.group+'"]').append(makeProduct(item))}
let products=[...document.querySelectorAll('.product')];
function bind(p){const id=p.dataset.id;p.dataset.group=p.dataset.group||p.closest('.category').dataset.group;p.dataset.defaultQty=p.dataset.defaultQty||p.querySelector('.qty').value;
const tools=document.createElement('div');tools.className='manage-tools';tools.innerHTML='<button type="button" class="edit">編集</button><button type="button" class="delete">削除</button>';p.append(tools);
p.querySelector('.pick').addEventListener('change',e=>{state[id]={...(state[id]||{}),selected:e.target.checked};persist();update()});
p.querySelector('.minus').onclick=()=>quantity(-1);p.querySelector('.plus').onclick=()=>quantity(1);
function quantity(delta){const q=p.querySelector('.qty');q.value=Math.max(1,Math.min(9999,(Number(q.value)||1)+delta));state[id]={...(state[id]||{}),qty:Number(q.value)};persist()}
p.querySelector('.qty').onchange=e=>{e.target.value=Math.max(1,Math.min(9999,Math.floor(Number(e.target.value)||1)));state[id]={...(state[id]||{}),qty:Number(e.target.value)};persist()};
p.querySelector('.bought').onclick=()=>{state[id]={...(state[id]||{}),selected:false,bought:false};persist();update()};
p.querySelector('.edit').onclick=()=>{editing=id;nameInput.value=p.querySelector('label span').textContent;groupInput.value=p.dataset.group;saveBtn.textContent='変更を保存';cancelBtn.style.display='';document.getElementById('manage').scrollIntoView({behavior:'smooth',block:'start'});nameInput.focus()};
p.querySelector('.delete').onclick=()=>{const label=p.querySelector('label span').textContent;if(!confirm('「'+label+'」を商品一覧から削除する？'))return;custom=custom.filter(x=>x.id!==id);if(!id.startsWith('custom-')){custom.push({id,name:label,group:p.dataset.group,deleted:true})}delete state[id];p.remove();products=products.filter(x=>x!==p);if(editing===id)cancelEdit();persist();update()};}
// Deleted default products are recorded as tombstones so future page loads do not restore them.
for(const item of custom.filter(x=>x.deleted)){const p=products.find(p=>p.dataset.id===item.id);if(p){p.remove();products=products.filter(x=>x!==p)}}
for(const item of custom.filter(x=>!x.deleted&&!x.id.startsWith('custom-'))){const p=products.find(p=>p.dataset.id===item.id);if(p){p.querySelector('label span').textContent=item.name;p.dataset.group=item.group}}
for(const p of products)bind(p);
function update(){let n=0;for(const p of products){const id=p.dataset.id,st=state[id]||{};p.querySelector('.qty').value=st.qty||p.dataset.defaultQty||1;p.querySelector('.pick').checked=!!st.selected;p.classList.toggle('selected',!!st.selected);if(st.selected){chosen.append(p);n++}else{const dest=groups.find(g=>g.dataset.group===p.dataset.group)||groups[0];dest.append(p)}}document.getElementById('empty').style.display=n?'none':'';document.getElementById('count').textContent=n+'品目';filter()}
function filter(){const q=document.getElementById('search').value.trim().toLowerCase();for(const p of products){p.style.display=p.textContent.toLowerCase().includes(q)?'':'none'}}
function cancelEdit(){editing=null;nameInput.value='';saveBtn.textContent='商品を追加';cancelBtn.style.display='none'}cancelBtn.onclick=cancelEdit;
saveBtn.onclick=()=>{const name=nameInput.value.trim(),group=groupInput.value;if(!name){alert('商品名を入力してな');nameInput.focus();return}if(!group){alert('購入先を選んでな');return}if(editing){const p=products.find(p=>p.dataset.id===editing);if(!p)return cancelEdit();p.querySelector('label span').textContent=name;p.dataset.group=group;const old=custom.find(x=>x.id===editing);if(old){old.name=name;old.group=group}else custom.push({id:editing,name,group});cancelEdit()}else{const id='custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);const item={id,name,group};custom.push(item);const p=makeProduct(item);catalog.querySelector('.category[data-group="'+group+'"]').append(p);products.push(p);bind(p);nameInput.value=''}persist();update();document.getElementById('manageMessage').textContent='保存したで。次回開いても残るで。'};
document.getElementById('search').oninput=filter;
document.getElementById('restore').onclick=()=>{for(const id in state){state[id].bought=false;state[id].selected=false}persist();update()};
document.getElementById('clear').onclick=()=>{if(confirm('買うものの選択を全部解除する？')){for(const id in state)state[id].selected=false;persist();update()}};
document.getElementById('copy').onclick=()=>{const lines=products.filter(p=>(state[p.dataset.id]||{}).selected).map(p=>'□ '+p.querySelector('label span').textContent+' ×'+p.querySelector('.qty').value);const t='🐙たこ鉄 買い出し🐙\n'+lines.join('\n');if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>alert('コピーしたで')).catch(()=>prompt('コピーしてな',t));else prompt('コピーしてな',t)};
update();
})();</script></body></html>
