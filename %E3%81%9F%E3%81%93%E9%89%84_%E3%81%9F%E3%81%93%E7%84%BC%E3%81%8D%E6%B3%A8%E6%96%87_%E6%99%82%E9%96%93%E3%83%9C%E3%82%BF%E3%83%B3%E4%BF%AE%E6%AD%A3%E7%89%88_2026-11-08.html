<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>たこ鉄｜昼のお持ち帰り注文</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101010;color:#f5f0e5;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}main{max-width:650px;margin:auto;padding:20px 14px 55px}h1,h2{color:#e6c478;text-align:center}h1{font-size:29px;margin:12px 0}h2{font-size:21px}p{line-height:1.6}.sub{text-align:center;color:#c8bda5}.panel{background:#242424;border:1px solid #a88a48;border-radius:13px;padding:15px;margin:14px 0}.gold{color:#e6c478}.muted{color:#b9b3a6;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn,button{font-family:inherit;cursor:pointer}button{background:#292929;border:1px solid #a88a48;color:#fff;border-radius:9px;padding:12px 8px;font-size:15px;font-weight:650;min-height:44px}.btn:active,button:active{opacity:.75}.selected{background:#8c6c28;color:#fff;border-color:#f4d78c}.primary{background:linear-gradient(120deg,#8a681d,#e2c16c,#8a681d);color:#17120b;border:0;font-weight:800;width:100%;padding:15px;margin-top:12px}.outline{width:100%}.small{padding:8px 11px;min-height:36px}.line{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:9px 0}.count{display:flex;align-items:center;gap:12px}.count strong{min-width:20px;text-align:center}.count button{min-width:40px}.choice{display:flex;align-items:center;gap:8px;padding:11px 8px;border:1px solid #655839;border-radius:9px;margin:7px 0;cursor:pointer}.choice input{accent-color:#e6c478;width:19px;height:19px}.recommended{border-color:#d8b44d}.tag{font-size:11px;color:#e6c478}.price{color:#e6c478;font-weight:750}input[type=text],input[type=tel]{width:100%;padding:12px;border:1px solid #8c774b;background:#171717;color:#fff;font-size:17px;border-radius:8px}label.field{display:block;margin:13px 0 5px;color:#e6c478;font-weight:700}.error{color:#ff7373;white-space:pre-line}.danger{color:#ff5555}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.calendar button{min-height:39px;padding:4px;font-size:14px}.calendar button:disabled{opacity:.2}.calendar .day{text-align:center;font-size:12px;color:#d2c5aa}.timegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.timegrid button{padding:8px 2px;min-height:37px;font-size:13px}.hidden{display:none}.separator{border:0;border-top:1px solid #685a3c;margin:14px 0}.footer{text-align:center;color:#b9b3a6;font-size:12px;margin-top:25px}</style></head><body><main><h1>たこ鉄</h1><p class="sub">昼のお持ち帰り注文<br>11:00〜15:00・木曜定休</p><div id="app"><div class="panel"><h2>お持ち帰り注文</h2><p>LINE友だちは、たこ焼き1枚につき400円引き。何度でも利用OK！</p><button class="primary" type="button" onclick="change('list')">お持ち帰り注文する</button></div></div><p class="footer">※店舗からの返信をもって注文確定となります。<br>このページから自動送信はされません。</p></main><script>
const products=[['定番たこ焼き',1400],['和風素焼き',1400],['明太子マヨたこ焼き',1500],['ぶっかけネギ塩ダレ',1500],['ヒマラヤ岩塩ごま油',1500],['チーズダッカルビ風',1600],['カレーてりたま／てりたま',1600],['ヤンニョムキムチ',1700],['エビ紅生姜タルタル',1800],['つけたこ焼き',1800]];
const toppings=[['ネギ',200],['チーズ盛り',200],['ゆかり',200],['わさび',200],['てりたま',300],['チーズイン',400],['ガリバタ',400],['キムチ',400],['からしマヨに変更',200],['タコ→ポテサラ変更',0]];
const sauces=['ポン酢','たこ鉄特製醤油ダレ','酢豚のタレ（甘酢あん）','デミグラスソース','チリソース','ベルのタレ','オーロラソース','ヒマラヤ岩塩','からしマヨネーズ'];
let stage='home',cart=[],product=-1,qty=1,flavor='',top=[],dip=[],discount=true,name='',phone='',date='',time='',error='',month=new Date(new Date().getFullYear(),new Date().getMonth(),1);
const app=document.getElementById('app'),money=n=>n.toLocaleString('ja-JP')+'円',esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(s,fn,cls='')=>`<button class="${cls}" onclick="${fn}">${s}</button>`;
function change(s){stage=s;error='';render();window.scrollTo(0,0)}
function choose(i){product=i;qty=1;flavor='';top=[];dip=[];change('detail')}
function flavorOptions(){if(product===0)return ['甘口','旨口','辛口'];if(product===6)return ['カレーてりたま','てりたま'];return []}
function unit(){return products[product][1]+top.reduce((a,i)=>a+toppings[i][1],0)}
function total(){return cart.reduce((a,c)=>a+c.unit*c.qty,0)}
function discountTotal(){return cart.reduce((a,c)=>a+(c.discount?400*c.qty:0),0)}
function render(){let h='';if(stage==='home'){h='<div class="panel"><h2>お持ち帰り注文</h2><p>LINE友だちは、たこ焼き1枚につき400円引き。何度でも利用OK！</p>'+btn('お持ち帰り注文する',"change('list')",'primary')+'</div>'}
if(stage==='list'){h='<h2>商品を選択</h2><p class="muted">全商品15個入り・価格の安い順</p>';products.forEach((p,i)=>h+=`<div class="panel line"><div><b>${esc(p[0])}</b><div class="price">${money(p[1])}</div></div>${btn('選ぶ',`choose(${i})`,'small')}</div>`);if(cart.length)h+=btn(`カートを見る（${cart.length}件）`,"change('cart')",'primary')}
if(stage==='detail'){let p=products[product];h=`<h2>${esc(p[0])}</h2><div class="panel"><div class="line"><b>基本価格</b><span class="price">${money(p[1])}／枚</span></div><div class="line"><b>注文枚数</b><div class="count">${btn('−','qty=Math.max(1,qty-1);render()','small')}<strong>${qty}</strong>${btn('＋','qty++;render()','small')}</div></div>`;let fo=flavorOptions();if(fo.length){h+='<hr class="separator"><b class="gold">味を選択（必須）</b><div class="grid">';fo.forEach(x=>h+=btn(esc(x),`flavor=${JSON.stringify(x)};render()`,flavor===x?'selected':''));h+='</div>'}if(product===9){h+='<hr class="separator"><b class="gold">つけ汁を2つ選んでください（必須）</b><p class="muted">同じつけ汁を2つ選ぶこともできます（現在 '+dip.length+'/2）</p>';sauces.forEach((s,i)=>h+=`<div class="line"><span>${esc(s)}</span><div class="count">${btn('−',`dip.splice(dip.indexOf(${i}),1);render()`,'small'+(dip.includes(i)?'':' hidden'))}<strong>${dip.filter(v=>v===i).length}</strong>${btn('＋',`if(dip.length<2)dip.push(${i});render()`,'small')}</div></div>`)}h+='<hr class="separator"><b class="gold">トッピング（複数選択OK）</b><p class="muted">おすすめ表示だけでは追加されません。選んだものだけ加算します。</p>';toppings.forEach((t,i)=>{let recommended=[1,0,8].includes(i);h+=`<label class="choice ${recommended?'recommended':''}"><input type="checkbox" ${top.includes(i)?'checked':''} onchange="toggleTop(${i})"><span>${esc(t[0])} ${recommended?'<span class="tag">おすすめ</span>':''}</span><span class="price" style="margin-left:auto">${t[1]?'+'+money(t[1]):'無料'}</span></label>`});h+=`<hr class="separator"><label class="choice"><input type="checkbox" ${discount?'checked':''} onchange="discount=this.checked;render()">LINE友だち割引（1枚400円引き）</label><div class="line"><b>商品小計</b><strong class="price">${money((unit()-(discount?400:0))*qty)}</strong></div><p class="muted">受取時にLINE友だち画面をご提示ください。</p>${error?'<p class="error">'+esc(error)+'</p>':''}${btn('カートに追加','addCart()','primary')}</div>`;h+=btn('商品一覧へ戻る',"change('list')",'outline')}
if(stage==='cart'){h='<h2>カート</h2>';cart.forEach((c,i)=>h+=`<div class="panel"><b>${i+1}. ${esc(c.name)} × ${c.qty}枚</b>${c.flavor?'<p>味：'+esc(c.flavor)+'</p>':''}${c.top.length?'<p>トッピング：'+c.top.map(j=>esc(toppings[j][0])).join('・')+'</p>':'<p>トッピング：なし</p>'}${c.dip.length?'<p>つけ汁：'+c.dip.map(j=>esc(sauces[j])).join('・')+'</p>':''}<p>小計：${money((c.unit-(c.discount?400:0))*c.qty)}</p>${btn('削除',`cart.splice(${i},1);render()`,'small danger')}</div>`);h+=`<div class="panel"><div class="line"><span>商品合計</span><b>${money(total())}</b></div><div class="line danger"><span>LINE友だち割引</span><b>−${money(discountTotal())}</b></div><div class="line"><b>お支払い合計</b><b class="price">${money(total()-discountTotal())}</b></div></div>`+btn('別の商品を追加',"change('list')",'outline');if(cart.length)h+=btn('注文手続きへ',"change('info')",'primary')}
if(stage==='info'){h='<h2>受取情報</h2><div class="panel"><label class="field">お名前</label><input type="text" id="nm" placeholder="例：鈴木" value="'+esc(name)+'" oninput="name=this.value"><label class="field">携帯番号</label><input type="tel" id="ph" inputmode="numeric" placeholder="09012345678" value="'+esc(phone)+'" oninput="phone=this.value"><label class="field">受取希望日</label>'+calendar()+'<label class="field">受取希望時間</label>'+timeButtons()+'<p class="muted">昼11:00〜15:00／木曜休み／調理約20分</p>'+ (error?'<p class="error">'+esc(error)+'</p>':'')+btn('注文確認へ','validate()','primary')+'</div>'+btn('カートへ戻る',"change('cart')",'outline')}
if(stage==='confirm'){h='<h2>注文内容の確認</h2><div class="panel">'+orderLines().map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>'+btn('注文内容をコピー','copyOrder()','primary')+'<p class="muted">コピーした注文内容をLINE公式トークに貼り付けて送信してください。店舗からの返信をもって注文確定となります。</p>'+btn('内容を修正する',"change('info')",'outline')}
app.innerHTML=h}
function toggleTop(i){top=top.includes(i)?top.filter(v=>v!==i):[...top,i];render()}
function addCart(){if(flavorOptions().length&&!flavor){error='味を選んでください';render();return}if(product===9&&dip.length!==2){error='つけ汁を2つ選んでください';render();return}cart.push({name:products[product][0],qty,flavor,top:[...top],dip:[...dip],discount,unit:unit()});change('cart')}
function calendar(){let today=new Date();today.setHours(0,0,0,0);let y=month.getFullYear(),m=month.getMonth(),days=new Date(y,m+1,0).getDate(),first=new Date(y,m,1).getDay();let h=`<div class="line">${btn('◀','prevMonth()','small')}<b>${y}年${m+1}月</b>${btn('▶','nextMonth()','small')}</div><div class="calendar">`;['日','月','火','水','木','金','土'].forEach(d=>h+='<div class="day">'+d+'</div>');for(let j=0;j<first;j++)h+='<span></span>';for(let d=1;d<=days;d++){let dt=new Date(y,m,d),s=`${y}/${String(m+1).padStart(2,'0')}/${String(d).padStart(2,'0')}`;h+=`<button ${dt<today||dt.getDay()===4?'disabled':''} class="${date===s?'selected':''}" onclick="date='${s}';render()">${d}</button>`}return h+'</div><p class="muted">選択日：'+(date||'未選択')+'</p>'}
function prevMonth(){let n=new Date(month.getFullYear(),month.getMonth()-1,1),t=new Date();if(n.getFullYear()>t.getFullYear()||(n.getFullYear()===t.getFullYear()&&n.getMonth()>=t.getMonth()))month=n;render()}
function nextMonth(){month=new Date(month.getFullYear(),month.getMonth()+1,1);render()}
function timeButtons(){let h='<div class="timegrid">';for(let hour=11;hour<=15;hour++){for(let minute=0;minute<60;minute+=10){if(hour===15&&minute>0)break;let t=String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0');h+=`<button type="button" class="${time===t?'selected':''}" onclick="time='${t}';render()">${t}</button>`}}return h+'</div><p class="muted">選択時間：'+(time||'未選択')+'</p>'}
function normPhone(){return phone.replace(/\D/g,'')}
function normTime(){let s=time.replace(/\D/g,'');if(s.length!==4)return '';let hh=Number(s.slice(0,2)),mm=Number(s.slice(2));if(hh<11||hh>15||(hh===15&&mm!==0)||mm>59)return '';return s.slice(0,2)+':'+s.slice(2)}
function validate(){error='';if(!name.trim())error+='お名前を入力してください。\n';if(!/^0\d{10}$/.test(normPhone()))error+='携帯番号を11桁で入力してください。\n';if(!date)error+='受取希望日を選んでください。\n';if(!normTime())error+='希望時間は11:00〜15:00の4桁で入力してください。\n';if(date){let d=new Date(date.replaceAll('/','-')+'T00:00:00'),now=new Date();now.setHours(0,0,0,0);if(d<now||d.getDay()===4)error+='選択できない受取日です。\n';if(d.getTime()===now.getTime()&&normTime()){let [hh,mm]=normTime().split(':').map(Number);let target=new Date();target.setHours(hh,mm,0,0);if(target<new Date(Date.now()+20*60000))error+='受取時間は現在から20分以上先を指定してください。\n'}}if(error){render();return}change('confirm')}
function orderLines(){let out=['【たこ鉄・昼お持ち帰り注文】'];cart.forEach((c,i)=>{out.push(`${i+1}. ${c.name} × ${c.qty}枚`);if(c.flavor)out.push('味：'+c.flavor);out.push('トッピング：'+(c.top.length?c.top.map(j=>toppings[j][0]).join('・'):'なし'));if(c.dip.length)out.push('つけ汁：'+c.dip.map(j=>sauces[j]).join('・'));out.push('小計：'+money((c.unit-(c.discount?400:0))*c.qty),'')});out.push('商品合計：'+money(total()),'LINE友だち割引：−'+money(discountTotal()),'合計：'+money(total()-discountTotal()),'お名前：'+name.trim(),'携帯番号：'+normPhone().replace(/^(\d{3})(\d{4})(\d{4})$/,'$1-$2-$3'),'受取希望日時：'+date+' '+normTime(),'調理所要時間：約20分','※店舗からの返信をもって注文確定');return out}
async function copyOrder(){let s=orderLines().join('\n');try{await navigator.clipboard.writeText(s);alert('注文内容をコピーしました。LINEに貼り付けて送信してください。')}catch(e){let t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();let ok=document.execCommand('copy');t.remove();alert(ok?'コピーしました。LINEに貼り付けてください。':'コピーできませんでした。ブラウザで開いて再度お試しください。')}}
try{render()}catch(e){document.getElementById('app').insertAdjacentHTML('beforeend','<p class="error">表示エラーが発生しました。公開URLから開いてください。</p>')}</script></body></html>
