unction filter(){const q=document.getElementById('search').value.trim().toLowerCase();for(const p of products){const st=state[p.dataset.id]||{};p.style.display=st.bought||!p.textContent.toLowerCase().includes(q)?'none':''}}for(const p of products){const id=p.dataset.id;p.dataset.defaultQty=p.querySelector('.qty').value;p.dataset.group=p.closest('.category').dataset.group;p.querySelector('.pick').onchange=e=>{state[id]={...(state[id]||{}),selected:e.target.checked,bought:false};persist();update()};p.querySelector('.minus').onclick=()=>quantity(-1);p.querySelector('.plus').onclick=()=>quantity(1);function quantity(d){const q=p.querySelector('.qty');q.value=Math.max(1,Math.min(9999,(+q.value||1)+d));state[id]={...(state[id]||{}),qty:+q.value};persist()}p.querySelector('.qty').onchange=e=>{e.target.value=Math.max(1,Math.min(9999,Math.floor(+e.target.value||1)));state[id]={...(state[id]||{}),qty:+e.target.value};persist()};p.querySelector('.bought').onclick=()=>{state[id]={...(state[id]||{}),selected:false,bought:true};persist();update()}}document.getElementById('search').oninput=filter;document.getElementById('restore').onclick=()=>{if(confirm('購入済みを商品一覧に戻す？')){for(const id in state)if(state[id].bought){state[id].bought=false;state[id].selected=false}persist();update()}};document.getElementById('clear').onclick=()=>{if(confirm('買うものの選択を全部解除する？')){for(const id in state)state[id].selected=false;persist();update()}};document.getElementById('copy').onclick=()=>{const lines=products.filter(p=>(state[p.dataset.id]||{}).selected).map(p=>'□ '+p.querySelector('label span').textContent+' ×'+p.querySelector('.qty').value);const t='🐙たこ鉄 買い出し🐙\n'+lines.join('\n');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>alert('コピーしたで')).catch(()=>prompt('コピーしてな',t));else prompt('コピーしてな',t)};update();</script></body></html>
